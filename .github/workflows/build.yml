name: Next.js Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Scouter7563

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Scouter7563/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
